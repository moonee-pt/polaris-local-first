<!doctype html><html lang="zh-CN" data-polaris-appearance="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>/* ═══ Polaris Design Tokens ═══ */
/* 来源：合并前视觉稿，现统一收口到 Polaris 主线 */

:root {
  --font-emoji: 'Apple Color Emoji', 'Apple Symbols', 'Segoe UI Emoji', 'Noto Color Emoji';
  --font-ui: 'PingFang SC', 'Hiragino Sans GB', -apple-system, BlinkMacSystemFont, var(--font-emoji), sans-serif;
  --font-body: var(--font-ui);
  --font-display-latin: 'Cormorant Garamond', Georgia, serif;
  --font-mono: 'SF Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, var(--font-emoji), monospace;

  /* ── Warm Palette (Collection World) ── */
  --bg: linear-gradient(180deg, #ffffff 0%, #f7f7f7 58%, #ececec 100%);
  --warm-bg: linear-gradient(180deg, #ffffff 0%, #f7f7f7 58%, #ececec 100%);
  --warm-surface: rgba(255, 255, 255, 0.74);
  --warm-surface-solid: #ffffff;
  --warm-surface-deep: rgba(244, 244, 244, 0.9);
  --warm-border: rgba(17, 17, 17, 0.08);
  --warm-border-hover: rgba(17, 17, 17, 0.22);
  --warm-text: #111111;
  --warm-text-soft: #5f5f5f;
  --warm-text-muted: #9b9b9b;
  --warm-accent: #222222;
  --warm-accent-soft: rgba(17, 17, 17, 0.06);
  --warm-accent-glow: rgba(17, 17, 17, 0.08);

  /* ── Cool Palette (Chat World) ── */
  --chat-bg: linear-gradient(168deg, #ffffff 0%, #f4f4f4 42%, #e9e9e9 100%);
  --cool-bg: linear-gradient(168deg, #ffffff 0%, #f4f4f4 42%, #e9e9e9 100%);
  --cool-surface: rgba(255, 255, 255, 0.72);
  --cool-surface-solid: #ffffff;
  --cool-surface-deep: rgba(245, 245, 245, 0.92);
  --cool-border: rgba(17, 17, 17, 0.08);
  --cool-border-hover: rgba(17, 17, 17, 0.22);
  --cool-text: #111111;
  --cool-text-soft: #5d5d5d;
  --cool-text-muted: #989898;
  --cool-accent: #1a1a1a;
  --cool-accent-soft: rgba(17, 17, 17, 0.08);
  --cool-accent-glow: rgba(17, 17, 17, 0.1);
  --surface: var(--warm-surface);
  --surface-solid: var(--warm-surface-solid);
  --surface-deep: var(--warm-surface-deep);
  --border: var(--warm-border);
  --border-hover: var(--warm-border-hover);
  --text: var(--warm-text);
  --text-soft: var(--warm-text-soft);
  --text-muted: var(--warm-text-muted);
  --accent: var(--warm-accent);
  --accent-soft: var(--warm-accent-soft);
  --accent-glow: var(--warm-accent-glow);
  --card-bg: linear-gradient(140deg, #ffffff 0%, #f4f4f4 58%, #ebebeb 100%);
  --shadow: 0 12px 28px rgba(17, 17, 17, 0.06), 0 0 0 1px rgba(17, 17, 17, 0.08);
  --shadow-hover: 0 18px 42px rgba(17, 17, 17, 0.1), 0 0 0 1px rgba(17, 17, 17, 0.12);

  /* ── Chat Bubbles ── */
  --bubble-user: linear-gradient(135deg, rgba(24, 24, 24, 0.12) 0%, rgba(24, 24, 24, 0.04) 100%);
  --bubble-ai: linear-gradient(135deg, rgba(255, 255, 255, 0.98) 0%, rgba(241, 241, 241, 0.94) 100%);
  --chat-bubble-user-fill: var(--bubble-user);
  --chat-bubble-user-border: 1px solid color-mix(in srgb, var(--border-hover) 92%, transparent);
  --chat-bubble-user-shadow: var(--shadow-bubble);
  --chat-bubble-user-radius: var(--radius-xl) var(--radius-xl) 6px var(--radius-xl);
  --chat-bubble-assistant-fill: transparent;
  --chat-bubble-assistant-border: none;
  --chat-bubble-assistant-radius: 0;
  --chat-bubble-assistant-padding: 0;
  --chat-bubble-assistant-shadow: none;
  --chat-bubble-assistant-backdrop: none;
  --chat-system-note-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 18%, transparent) 0%, color-mix(in srgb, var(--surface) 10%, transparent) 100%);
  --chat-system-note-fill-hover: linear-gradient(180deg, color-mix(in srgb, var(--surface) 28%, transparent) 0%, color-mix(in srgb, var(--surface) 18%, transparent) 100%);
  --chat-system-note-border: 1px solid color-mix(in srgb, var(--border) 32%, transparent);
  --chat-system-note-border-hover: 1px solid color-mix(in srgb, var(--border-hover) 46%, transparent);
  --chat-system-note-shadow: 0 8px 18px color-mix(in srgb, var(--accent-soft) 6%, transparent);
  --chat-system-note-shadow-hover: 0 10px 20px color-mix(in srgb, var(--accent-soft) 8%, transparent);
  --chat-system-note-backdrop: blur(16px) saturate(118%);
  --chat-composer-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 16%, transparent) 0%, color-mix(in srgb, var(--surface) 10%, transparent) 100%);
  --chat-composer-fill-focus: linear-gradient(180deg, color-mix(in srgb, var(--surface) 20%, transparent) 0%, color-mix(in srgb, var(--surface) 12%, transparent) 100%);
  --chat-composer-border: 1px solid color-mix(in srgb, var(--border-hover) 62%, transparent);
  --chat-composer-border-focus: 1px solid color-mix(in srgb, var(--border-hover) 82%, transparent);
  --chat-composer-shadow: 0 14px 24px color-mix(in srgb, var(--accent-soft) 8%, transparent);
  --chat-composer-shadow-soft: 0 8px 14px color-mix(in srgb, var(--accent-soft) 7%, transparent);
  --chat-composer-shadow-focus: 0 16px 28px color-mix(in srgb, var(--accent-soft) 10%, transparent);
  --chat-composer-backdrop: blur(20px) saturate(130%);
  --chat-preview-strip-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 7%, transparent) 0%, color-mix(in srgb, var(--surface) 3%, var(--accent-soft) 2%) 100%);
  --chat-preview-strip-border: 1px solid color-mix(in srgb, var(--border-hover) 16%, transparent);
  --chat-preview-strip-shadow: 0 5px 12px color-mix(in srgb, var(--accent-soft) 3%, transparent);
  --chat-preview-strip-backdrop: blur(10px) saturate(1.01);
  --chat-send-active-fill: linear-gradient(135deg, var(--accent), var(--accent));
  --chat-send-active-text: #fff;

  /* ── Panels ── */
  --sheet-surface-radius: 24px 24px 0 0;
  --sheet-surface-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface-solid) 98%, rgba(255,255,255,0.18)), color-mix(in srgb, var(--surface-solid) 94%, var(--surface-deep)));
  --sheet-surface-border: 1px solid color-mix(in srgb, var(--border) 78%, rgba(255,255,255,0.18));
  --sheet-surface-shadow: 0 20px 44px rgba(94, 80, 64, 0.14);
  --sheet-surface-backdrop: blur(24px) saturate(1.2);
  --sheet-readable-text: color-mix(in srgb, var(--text) 86%, #1e2434 14%);
  --sheet-readable-soft: color-mix(in srgb, var(--text-soft) 56%, var(--sheet-readable-text) 44%);
  --sheet-readable-muted: color-mix(in srgb, var(--text-muted) 28%, var(--sheet-readable-text) 72%);
  --control-surface: linear-gradient(
    180deg,
    color-mix(in srgb, var(--surface-solid) 78%, var(--surface-deep) 22%),
    color-mix(in srgb, var(--surface) 78%, var(--surface-deep) 22%)
  );
  --control-surface-focus: linear-gradient(
    180deg,
    color-mix(in srgb, var(--surface-solid) 84%, var(--surface-deep) 16%),
    color-mix(in srgb, var(--surface) 84%, var(--surface-deep) 16%)
  );
  --control-surface-solid: color-mix(in srgb, var(--surface-solid) 74%, var(--surface) 26%);
  --control-border-color: color-mix(in srgb, var(--border) 66%, transparent);
  --control-border: 1px solid var(--control-border-color);
  --control-border-focus-color: color-mix(in srgb, var(--border-hover) 78%, var(--accent) 22%);
  --control-border-focus: 1px solid var(--control-border-focus-color);
  --control-text: var(--text);
  --control-placeholder: color-mix(in srgb, var(--text-muted) 74%, transparent);
  --control-shadow: 0 10px 24px color-mix(in srgb, var(--surface-deep) 10%, transparent), inset 0 1px 0 color-mix(in srgb, var(--surface-solid) 42%, transparent);
  --control-focus-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent-soft) 38%, transparent), 0 14px 30px color-mix(in srgb, var(--surface-deep) 12%, transparent), inset 0 1px 0 color-mix(in srgb, var(--surface-solid) 48%, transparent);
  --theme-studio-stage-radius: 24px;
  --theme-studio-stage-border: 1px solid var(--border);
  --theme-studio-stage-fill:
    linear-gradient(180deg, color-mix(in srgb, var(--surface-deep) 82%, transparent), color-mix(in srgb, var(--surface) 62%, transparent)),
    radial-gradient(circle at top right, var(--accent-glow), transparent 34%);
  --theme-studio-stage-shadow: 0 12px 36px rgba(96, 112, 156, 0.08);
  --theme-timeline-shell-radius: 24px;
  --theme-timeline-shell-border: 1px solid var(--border);
  --theme-timeline-shell-fill:
    linear-gradient(180deg, color-mix(in srgb, var(--surface-deep) 82%, transparent), color-mix(in srgb, var(--surface) 62%, transparent)),
    radial-gradient(circle at top right, var(--accent-glow), transparent 34%);
  --theme-timeline-shell-shadow: 0 12px 34px rgba(96, 112, 156, 0.08);
  --code-workshop-sheet-radius: 32px;
  --code-workshop-sheet-border: 1px solid color-mix(in srgb, var(--border-hover) 42%, rgba(255,255,255,0.22));
  --code-workshop-sheet-fill:
    radial-gradient(circle at top left, color-mix(in srgb, var(--border-hover) 10%, transparent), transparent 32%),
    radial-gradient(circle at 82% 16%, color-mix(in srgb, var(--surface) 8%, transparent), transparent 28%),
    linear-gradient(180deg, color-mix(in srgb, var(--surface-solid) 96%, rgba(255,255,255,0.14)), color-mix(in srgb, var(--surface-solid) 90%, var(--surface-deep)));
  --code-workshop-sheet-base-fill: color-mix(in srgb, var(--card-bg) 52%, transparent);
  --code-workshop-sheet-shadow: 0 18px 42px rgba(127, 88, 55, 0.1), inset 0 1px 0 rgba(255,255,255,0.12);
  --code-workshop-sheet-header-border: 1px solid color-mix(in srgb, var(--border) 42%, transparent);
  --code-workshop-sheet-header-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 54%, rgba(255,255,255,0.14)), transparent);
  --code-workshop-sheet-close-border: 1px solid color-mix(in srgb, var(--border-hover) 72%, transparent);
  --code-workshop-sheet-close-fill: color-mix(in srgb, var(--surface) 84%, rgba(255,255,255,0.24));
  --code-workshop-sheet-close-color: var(--text-soft);
  --code-workshop-source-bar-border: 1px solid color-mix(in srgb, var(--border) 36%, transparent);
  --code-workshop-source-bar-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 18%, transparent), transparent);
  --code-workshop-board-radius: 24px;
  --code-workshop-board-border: 1px solid color-mix(in srgb, var(--border) 42%, transparent);
  --code-workshop-board-fill: linear-gradient(180deg, color-mix(in srgb, var(--surface) 18%, transparent), color-mix(in srgb, var(--surface-solid) 10%, transparent));
  --code-workshop-board-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
  --code-workshop-board-backdrop: blur(8px);
  --code-workshop-input-border: var(--control-border);
  --code-workshop-input-fill: var(--control-surface);
  --code-workshop-input-shadow: var(--control-shadow);
  --code-run-fullscreen-fill: color-mix(in srgb, var(--bg) 98%, rgba(255,255,255,.88));
  --code-run-fullscreen-backdrop: blur(22px);
  --code-run-fullscreen-close-border: 1px solid var(--border);
  --code-run-fullscreen-close-fill: color-mix(in srgb, var(--surface) 84%, transparent);
  --code-run-fullscreen-close-color: var(--text-soft);
  --code-run-fullscreen-stage-border: 1px solid color-mix(in srgb, var(--border-hover) 52%, transparent);
  --code-run-fullscreen-stage-fill: color-mix(in srgb, var(--surface-solid) 88%, transparent);
  --shadow-panel: 0 18px 42px rgba(17, 17, 17, 0.1);
  --shadow-bubble: 0 4px 14px rgba(17, 17, 17, 0.05);

  /* ── Status Colors ── */
  --color-success: #6baf7b;
  --color-warning: #d4a853;
  --color-error: #c76e5a;
  --color-info: #7b8abf;

  /* ── Border Radius ── */
  --radius-xs: 4px;
  --radius-sm: 9px;
  --radius-md: 11px;
  --radius-lg: 14px;
  --radius-xl: 16px;
  --radius-2xl: 18px;
  --radius-pill: 20px;
  --radius-panel: 24px;

  /* ── Radius Contract ── */
  --radius-flat: 0px;
  --radius-chip: 2px;
  --radius-control: 6px;
  --radius-surface: 10px;
  --radius-round: 999px;

  /* ── Motion ── */
  --duration-instant: 0.15s;
  --duration-fast: 0.25s;
  --duration-normal: 0.3s;
  --duration-slow: 0.5s;
  --duration-world: 0.12s;
  --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

  /* ── Typography ── */
  --type-brand: 18px;
  --type-panel-title: 20px;
  --type-body: 13.5px;
  --type-card-title: 12.5px;
  --type-label: 12px;
  --type-small: 11.5px;
  --type-caption: 10.5px;
  --type-micro: 10px;
  --type-tag: 9.5px;
  --type-tiny: 9px;
  --type-code: 10px;
}

  --chat-system-note-fill-hover: linear-gradient(180deg, color-mix(in srgb, var(--cool-surface) 54%, transparent) 0%, color-mix(in srgb, var(--cool-surface-deep) 42%, transparent) 100%) !important;

  --chat-composer-fill: linear-gradient(180deg, color-mix(in srgb, var(--cool-surface) 44%, transparent) 0%, color-mix(in srgb, var(--cool-surface-deep) 38%, transparent) 100%) !important;
  --chat-composer-fill-focus: linear-gradient(180deg, color-mix(in srgb, var(--cool-surface) 56%, transparent) 0%, color-mix(in srgb, var(--cool-surface-deep) 46%, transparent) 100%) !important;

  --color-success: #84c994 !important;

</style><style>.message-rich-text { display: flex; flex-direction: column; gap: 0.56em; white-space: pre-wrap; word-break: break-word; line-height: inherit; font-weight: 400; letter-spacing: 0; }
.message-rich-text-paragraph { margin: 0; line-height: inherit; }

</style><style>/* Chat option bar: the assistant hands back a short list of directions to pick from.
   Palette follows the bottom shelf tab's active pink (#fff2f6 -> #f6b9c9, detail #d588a1),
   watered down so the slab reads as frosted glass instead of a card. The edge is one drawn
   border plus a soft top light, so all four sides sit on the same line. */

.message-option-bar {
  --option-pink-light: #fff7fa;
  --option-pink: #fbd3e0;
  --option-pink-ink: #d588a1;
  --option-pink-deep: #c46f8d;
  --option-pink-text: #4a2431;

  position: relative;
  padding: 0.24em 0;
  border-radius: 12px;
  border: 1px solid color-mix(in srgb, #ffffff 74%, var(--option-pink) 26%);
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, #ffffff 64%, transparent) 0%,
      color-mix(in srgb, #ffffff 10%, transparent) 42%,
      color-mix(in srgb, #ffffff 0%, transparent) 100%
    ),
    linear-gradient(
      142deg,
      color-mix(in srgb, var(--option-pink-light) 58%, transparent) 0%,
      color-mix(in srgb, var(--option-pink) 38%, transparent) 100%
    );
  -webkit-backdrop-filter: blur(28px) saturate(185%) brightness(1.04);
  backdrop-filter: blur(28px) saturate(185%) brightness(1.04);
  box-shadow:
    0 20px 40px -26px color-mix(in srgb, var(--option-pink-ink) 62%, transparent),
    0 4px 12px -8px rgba(74, 36, 49, 0.14);
  overflow: hidden;
}

.message-option-bar-list {
  display: flex;
  flex-direction: column;
}

.message-option-bar-list > * + * {
  border-top: 1px solid color-mix(in srgb, var(--option-pink-ink) 16%, transparent);
}

.message-option-bar-row {
  display: flex;
  align-items: center;
  gap: 0.64em;
  width: 100%;
  min-height: max(44px, 2.75em);
  padding: 0.6em 0.9em;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--text);
  font: inherit;
  line-height: 1.42;
  text-align: left;
}

button.message-option-bar-row {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: background 160ms ease, transform 160ms ease;
}

button.message-option-bar-row:active {
  background: color-mix(in srgb, var(--option-pink-ink) 15%, transparent);
  transform: scale(0.996);
}

@media (hover: hover) {
  button.message-option-bar-row:hover {
    background: color-mix(in srgb, var(--option-pink-ink) 8%, transparent);
  }
}

button.message-option-bar-row:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--option-pink-deep) 55%, transparent);
  outline-offset: -3px;
}

.message-option-bar-letter {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.95em;
  height: 1.95em;
  border-radius: 999px;
  font-size: 0.72em;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--option-pink-deep);
  background: color-mix(in srgb, var(--option-pink) 42%, #ffffff 58%);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--option-pink-ink) 24%, transparent);
}

.message-option-bar-text {
  flex: 1 1 auto;
  min-width: 0;
  overflow-wrap: anywhere;
}

.message-option-bar-row.is-chosen {
  color: var(--text);
}

.message-option-bar-row.is-chosen .message-option-bar-letter {
  background: linear-gradient(135deg, var(--option-pink) 0%, var(--option-pink-deep) 100%);
  color: var(--option-pink-text);
  box-shadow: none;
}

.message-option-bar-custom .message-option-bar-letter,
.message-option-bar.is-static .message-option-bar-row:not(.is-chosen) .message-option-bar-letter {
  background: color-mix(in srgb, var(--option-pink-ink) 12%, transparent);
  color: color-mix(in srgb, var(--option-pink-ink) 58%, var(--text-muted) 42%);
  box-shadow: none;
}

.message-option-bar.is-static .message-option-bar-row:not(.is-chosen) {
  color: var(--text-muted);
}

.message-option-bar-custom {
  display: flex;
  align-items: center;
  gap: 0.5em;
  min-height: max(46px, 2.9em);
  padding: 0.5em 0.62em 0.5em 0.9em;
}

.message-option-bar-custom input::placeholder {

}

.message-option-bar-custom input:focus {
  outline: none;
  background: color-mix(in srgb, #ffffff 68%, transparent);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--option-pink-ink) 34%, transparent);
}

.message-option-bar-send {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 1.95em;
  height: 1.95em;
  padding: 0;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: color-mix(in srgb, var(--option-pink-ink) 62%, var(--text-muted) 38%);
  cursor: pointer;
  transition: background 160ms ease, color 160ms ease, transform 160ms ease;
}

.message-option-bar-send[data-ready='true'] {
  background: linear-gradient(135deg, var(--option-pink) 0%, var(--option-pink-deep) 100%);
  color: var(--option-pink-text);
  box-shadow: 0 10px 18px -12px color-mix(in srgb, var(--option-pink-ink) 78%, transparent);
}

.message-option-bar-send:disabled {
  cursor: default;
}

.message-option-bar-send:active[data-ready='true'] {
  transform: scale(0.92);
}

.message-option-bar-send:focus-visible {
  outline: 2px solid color-mix(in srgb, var(--option-pink-deep) 55%, transparent);
  outline-offset: 2px;
}

/* Answered, or shown in a message that is no longer live: drop the glass, keep the rows. */
.message-option-bar.is-static {
  padding: 0;
  border: 0;
  border-radius: 0;
  background: none;
  -webkit-backdrop-filter: none;
  backdrop-filter: none;
  box-shadow: none;
}

/* Night rooms: keep the pink but let it glow through the dark instead of going opaque. */
html[data-polaris-appearance='dark'] .message-option-bar:not(.is-static) {
  border-color: color-mix(in srgb, var(--option-pink) 30%, transparent);
  background:
    linear-gradient(
      180deg,
      color-mix(in srgb, #ffffff 12%, transparent) 0%,
      color-mix(in srgb, #ffffff 0%, transparent) 46%
    ),
    linear-gradient(
      142deg,
      color-mix(in srgb, var(--option-pink) 16%, transparent) 0%,
      color-mix(in srgb, var(--option-pink-ink) 12%, transparent) 100%
    );
  -webkit-backdrop-filter: blur(26px) saturate(170%);
  backdrop-filter: blur(26px) saturate(170%);
  box-shadow:
    0 20px 40px -26px color-mix(in srgb, var(--option-pink-ink) 58%, transparent),
    0 4px 14px -10px rgba(0, 0, 0, 0.32);
}

html[data-polaris-appearance='dark'] .message-option-bar-custom input {
  background: color-mix(in srgb, #ffffff 10%, transparent);
}

@supports not ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
  .message-option-bar:not(.is-static) {
    background: linear-gradient(
      142deg,
      color-mix(in srgb, var(--option-pink-light) 92%, transparent) 0%,
      color-mix(in srgb, var(--option-pink) 72%, transparent) 100%
    );
  }
}

@media (prefers-reduced-transparency: reduce) {
  .message-option-bar:not(.is-static) {
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
    background: linear-gradient(142deg, var(--option-pink-light) 0%, color-mix(in srgb, var(--option-pink) 78%, #ffffff) 100%);
  }
}

@media (prefers-reduced-motion: reduce) {
  .message-option-bar-row,
  .message-option-bar-send,
  .message-option-bar-custom input {
    transition: none;
  }

  button.message-option-bar-row:active,
  .message-option-bar-send:active[data-ready='true'] {
    transform: none;
  }
}
</style>
